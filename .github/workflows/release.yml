name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/hapi_transmittance -DestinationPath dist/hapi_transmittance_win64_${{ github.ref_name }}.zip -CompressionLevel Optimal

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hapi_transmittance_win64_${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
